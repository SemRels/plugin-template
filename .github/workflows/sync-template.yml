name: Sync Template to Plugins

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Makefile
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - GOVERNANCE.md
      - SECURITY.md
      - MAINTAINERS.md
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run - report drift only, open no PRs
        type: boolean
        default: false
      include_workflows:
        description: Also sync .github/workflows/ files (requires SYNC_TOKEN with workflow scope - PAT from github.com/settings/tokens with repo+workflow scopes)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.discover.outputs.plugins }}
    steps:
      - name: Discover plugin repositories
        id: discover
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          ORG: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          plugins="$(
            gh api --paginate "orgs/${ORG}/repos?per_page=100&type=all" \
              --jq '.[] | select(.archived == false and .fork == false and
                (.name | test("^(analyzer|condition|generator|hook|packager|provider|publisher|updater)-"))) | .name' |
              jq -R -s -c 'split("\n") | map(select(length > 0)) | sort | unique'
          )"
          if [ "$plugins" = "[]" ]; then
            echo "No plugin repositories were discovered." >&2
            exit 1
          fi
          echo "Discovered plugins: $plugins"
          printf 'plugins=%s\n' "$plugins" >> "$GITHUB_OUTPUT"

  sync:
    name: "Sync ${{ matrix.plugin }}"
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}

    steps:
      - name: Check out template
        uses: actions/checkout@v7
        with:
          path: template

      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          repository: "SemRels/${{ matrix.plugin }}"
          token: ${{ secrets.SYNC_TOKEN }}
          path: plugin

      - name: Apply template files
        env:
          PLUGIN: ${{ matrix.plugin }}
          # Workflow files require the repository's SYNC_TOKEN to have the
          # GitHub Actions workflow scope. Never include them in unattended
          # push/schedule syncs, which use the least-privileged token.
          INCLUDE_WORKFLOWS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_workflows || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugin/.github/workflows
          for f in CODE_OF_CONDUCT.md CONTRIBUTING.md; do
            if [ -f "template/$f" ]; then
              sed "s/{{PROJECT_NAME}}/$PLUGIN/g; s/{{DEFAULT_BRANCH}}/main/g" "template/$f" > "plugin/$f"
            fi
          done
          for f in Makefile GOVERNANCE.md SECURITY.md MAINTAINERS.md; do
            if [ -f "template/$f" ]; then
              cp "template/$f" "plugin/$f"
            fi
          done
          if [ -f "template/Dockerfile" ]; then
            sed "s/plugin-template Authors/$PLUGIN Authors/" "template/Dockerfile" > "plugin/Dockerfile"
          fi
          if [ "$INCLUDE_WORKFLOWS" = "true" ]; then
            # semrel-release.yaml is a plugin-specific overlay and is not managed here.
            for wf in ci.yml release.yml security.yml; do
              if [ -f "template/.github/workflows/$wf" ]; then
                cp "template/.github/workflows/$wf" "plugin/.github/workflows/$wf"
              fi
            done
          fi

      - name: Create PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PLUGIN: ${{ matrix.plugin }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd plugin
          git config user.name  "semrel-sync-bot"
          git config user.email "bot@semrel.io"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/SemRels/${PLUGIN}.git"
          if git diff --quiet; then
            echo "OK $PLUGIN - no changes needed"
            exit 0
          fi
          CHANGED=$(git diff --name-only | tr '\n' ' ')
          echo "DRIFT $PLUGIN - $CHANGED"
          if [ "$DRY_RUN" = "true" ]; then
            echo "(dry-run - skipping PR)"
            exit 0
          fi
          SHORT_SHA="${COMMIT_SHA:0:7}"
          BRANCH="chore/sync-template-${SHORT_SHA}"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null 2>&1; then
            echo "Branch $BRANCH already exists - skipping"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: sync from plugin-template@${SHORT_SHA} -- $CHANGED"
          if ! git push origin "$BRANCH"; then
            if git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null 2>&1; then
              echo "Branch $BRANCH was created concurrently - skipping PR"
              exit 0
            fi
            exit 1
          fi
          TITLE="chore: sync from plugin-template"
          BODY="Automated sync from SemRels/plugin-template (${SHORT_SHA}). Updated: $CHANGED"
          gh pr create --repo "SemRels/$PLUGIN" --title "$TITLE" --body "$BODY" --base main || echo "PR may already exist"
